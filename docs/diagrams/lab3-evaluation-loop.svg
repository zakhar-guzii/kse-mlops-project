<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="554" viewBox="0 0 1000 554" role="img" aria-labelledby="title desc">
  <title id="title">Lab 3 evaluation loop</title>
  <desc id="desc">For each value of top-k, 3, 5 and 10, on one commit: the 32 questions of eval/questions.toml are sent to retrieve, which returns top-k passages from index 5570e99ba60e; Gemma 4 12B answers with prompts/rag.md; the same model judges each answer with prompts/judge.md; hit rate, MRR, the answer metric, tokens, shadow cost and latency are logged as one MLflow run in landcover-answers. After the three runs, the rule chooses the smallest top-k within two questions of the best, and retrieval.toml holds the choice, top_k 10.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#334155"/></marker>
  </defs>
  <style>
    text { font: 15px Helvetica, Arial, sans-serif; fill: #26354a; }
    .name { font-size: 17px; font-weight: bold; fill: #162e53; }
    g rect { fill: #eef4ff; stroke: #335582; stroke-width: 1.5; }
    .flow { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
    .label { fill: #244b75; }
  </style>
  <rect width="1000" height="554" fill="white"/>
  <g transform="translate(371 16)">
    <rect width="258" height="80" rx="7"/>
    <text class="name" x="14" y="24">Sweep over top-k</text>
    <text x="14" y="47">TOP_K = 3, 5 and 10</text>
    <text x="14" y="67">make answer-eval, one commit</text>
  </g>

  <g transform="translate(24 150)">
    <rect width="258" height="80" rx="7"/>
    <text class="name" x="14" y="24">Evaluation set</text>
    <text x="14" y="47">eval/questions.toml</text>
    <text x="14" y="67">32 questions with references</text>
  </g>

  <g transform="translate(371 150)">
    <rect width="258" height="80" rx="7"/>
    <text class="name" x="14" y="24">retrieve top-k</text>
    <text x="14" y="47">multilingual-e5-small,</text>
    <text x="14" y="67">index 5570e99ba60e</text>
  </g>

  <g transform="translate(718 150)">
    <rect width="258" height="80" rx="7"/>
    <text class="name" x="14" y="24">Gemma 4 12B QAT Q4_0</text>
    <text x="14" y="47">prompts/rag.md,</text>
    <text x="14" y="67">Sources: [n] or none</text>
  </g>

  <g transform="translate(24 304)">
    <rect width="258" height="80" rx="7"/>
    <text class="name" x="14" y="24">MLflow run</text>
    <text x="14" y="47">landcover-answers,</text>
    <text x="14" y="67">answer-rag-k&lt;n&gt;, hashes</text>
  </g>

  <g transform="translate(371 304)">
    <rect width="258" height="80" rx="7"/>
    <text class="name" x="14" y="24">Metrics</text>
    <text x="14" y="47">hit rate, MRR, answer correct,</text>
    <text x="14" y="67">tokens, cost, p50, p95</text>
  </g>

  <g transform="translate(718 304)">
    <rect width="258" height="80" rx="7"/>
    <text class="name" x="14" y="24">Judge</text>
    <text x="14" y="47">Same model, prompts/judge.md</text>
    <text x="14" y="67">correct or incorrect</text>
  </g>

  <g transform="translate(371 458)">
    <rect width="258" height="80" rx="7"/>
    <text class="name" x="14" y="24">Choice of top-k</text>
    <text x="14" y="47">Smallest k within two</text>
    <text x="14" y="67">questions of the best</text>
  </g>

  <g transform="translate(718 458)">
    <rect width="258" height="80" rx="7"/>
    <text class="name" x="14" y="24">retrieval.toml</text>
    <text x="14" y="47">top_k = 10,</text>
    <text x="14" y="67">served in Lab 4</text>
  </g>

  <path class="flow" d="M500 97 V147"/>
  <text class="label" x="514" y="128">top_k</text>
  <path class="flow" d="M283 190 H368"/>
  <path class="flow" d="M631 190 H715"/>
  <text class="label" x="673" y="181" text-anchor="middle">passages</text>
  <path class="flow" d="M847 231 V301"/>
  <text class="label" x="861" y="270">answer</text>
  <path class="flow" d="M500 231 V301"/>
  <text class="label" x="514" y="270">rank of the first hit</text>
  <path class="flow" d="M716 344 H633"/>
  <text class="label" x="673" y="335" text-anchor="middle">verdict</text>
  <path class="flow" d="M369 344 H286"/>
  <text class="label" x="327" y="335" text-anchor="middle">logged</text>
  <path class="flow" d="M24 344 H12 V56 H368"/>
  <text class="label" x="30" y="47">next k, until all three ran</text>
  <path class="flow" d="M153 385 V498 H368"/>
  <text class="label" x="167" y="452">three runs</text>
  <path class="flow" d="M631 498 H715"/>
</svg>
