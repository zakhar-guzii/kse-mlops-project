  <line class="div" x1="295" y1="291" x2="485" y2="291"/>
  <text class="managed" x="390" y="308" text-anchor="middle">RDS for PostgreSQL;</text>
  <text class="managed" x="390" y="324" text-anchor="middle">OpenSearch Serverless (vectors)</text>

  <rect class="comp" x="520" y="222" width="220" height="112" rx="6"/>
  <text class="name" x="630" y="244" text-anchor="middle">Airflow</text>
  <text class="local" x="630" y="263" text-anchor="middle">3.3.1, LocalExecutor</text>
  <line class="div" x1="535" y1="291" x2="725" y2="291"/>
  <text class="managed" x="630" y="314" text-anchor="middle">Amazon MWAA</text>

  <!-- Row 3 -->
  <rect class="comp" x="40" y="346" width="220" height="112" rx="6"/>
  <text class="name" x="150" y="368" text-anchor="middle">MLflow</text>
  <text class="local" x="150" y="387" text-anchor="middle">3.16.1, authentication,</text>
  <text class="local" x="150" y="404" text-anchor="middle">registry alias champion</text>
  <line class="div" x1="55" y1="415" x2="245" y2="415"/>
  <text class="managed" x="150" y="438" text-anchor="middle">SageMaker AI MLflow App</text>

  <rect class="comp" x="280" y="346" width="220" height="112" rx="6"/>
  <text class="name" x="390" y="368" text-anchor="middle">Monitoring</text>
  <text class="local" x="390" y="387" text-anchor="middle">Prometheus, Grafana,</text>
  <text class="local" x="390" y="404" text-anchor="middle">Alertmanager, Evidently</text>
  <line class="div" x1="295" y1="415" x2="485" y2="415"/>
  <text class="managed" x="390" y="432" text-anchor="middle">Amazon CloudWatch;</text>
  <text class="managed" x="390" y="448" text-anchor="middle">SageMaker Model Monitor</text>

  <rect class="comp" x="520" y="346" width="220" height="112" rx="6"/>
  <text class="name" x="630" y="368" text-anchor="middle">Container registry</text>
  <text class="local" x="630" y="387" text-anchor="middle">Minikube registry</text>
  <line class="div" x1="535" y1="415" x2="725" y2="415"/>
  <text class="managed" x="630" y="438" text-anchor="middle">Amazon ECR</text>

  <!-- Host-native -->
  <rect class="comp" x="770" y="98" width="205" height="160" rx="6"/>
  <text class="name" x="872" y="120" text-anchor="middle">LLM and embeddings</text>
  <text class="local" x="872" y="140" text-anchor="middle">host-native, not in</text>
  <text class="local" x="872" y="157" text-anchor="middle">Minikube: llama-server</text>
  <text class="local" x="872" y="174" text-anchor="middle">(Metal), Gemma 4 12B,</text>
  <text class="local" x="872" y="191" text-anchor="middle">Qwen3-Embedding-0.6B</text>
  <line class="div" x1="785" y1="214" x2="960" y2="214"/>
  <text class="managed" x="872" y="238" text-anchor="middle">Amazon Bedrock</text>

  <!-- External training resource -->
  <rect class="extbox" x="770" y="500" width="205" height="100" rx="6"/>
  <text class="name" x="872" y="522" text-anchor="middle">Training resource</text>
  <text class="local" x="872" y="541" text-anchor="middle">Colab Pro (owned),</text>
  <text class="local" x="872" y="558" text-anchor="middle">outside the host</text>
  <line class="div" x1="785" y1="569" x2="960" y2="569"/>
  <text class="managed" x="872" y="588" text-anchor="middle">SageMaker Training</text>

  <text class="foot" x="25" y="515">first draft: replaced by the real topology in Lab 4</text>
  <text class="foot" x="25" y="535">Feature store: not needed (no online entity features)</text>
  <text class="foot" x="25" y="555"><tspan class="managed" style="font-size:12px">Blue italic</tspan>: managed AWS equivalent, named for reference</text>
  <text class="foot" x="25" y="575">Selected cloud deployment (ECS on EC2, self-hosted Airflow, MLflow, monitoring): Section 6.2</text>
</svg>
