<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-labelledby="title desc">
  <title id="title">Deployment, first draft</title>
  <desc id="desc">The Mac M4 Pro host runs Minikube, whose managed equivalent is Amazon EKS. Inside Minikube: the segmentation service with FastAPI, web UI and CPU workers (EKS); the GIS assistant (EKS); identity with per-user tokens (Amazon Cognito); object storage, Floci (S3 API) with the DVC remote (Amazon S3); PostgreSQL 16 with pgvector (RDS for PostgreSQL; OpenSearch Serverless for vectors); Airflow 3.3.1 (Amazon MWAA); MLflow 3.16.1 (SageMaker AI MLflow App); monitoring with Prometheus, Grafana, Alertmanager and Evidently (Amazon CloudWatch; SageMaker Model Monitor); the container registry (Amazon ECR). Outside Minikube on the Mac host: LLM and embeddings in a host-native llama-server with Metal, Gemma 4 12B QAT and Qwen3-Embedding-0.6B (Amazon Bedrock). Outside the host: the training resource, Colab Pro (SageMaker Training). Blue italic names are managed AWS equivalents, given for reference; the selected cloud deployment is in Section 6.2. No arrows; Lab 4 replaces this first draft with the real topology. Feature store not needed.</desc>
  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #111827; }
    .host { fill: #f9fafb; stroke: #374151; stroke-width: 2; }
    .k8s { fill: #eef4ff; stroke: #1e40af; stroke-width: 2; stroke-dasharray: 6 4; }
    .comp { fill: #ffffff; stroke: #4b5563; stroke-width: 1.5; }
    .extbox { fill: #f3f4f6; stroke: #4b5563; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .area { font-size: 15px; font-weight: 700; fill: #1f2937; }
    .areasub { font-size: 13px; font-style: italic; fill: #1e40af; }
    .name { font-size: 14px; font-weight: 700; }
    .local { font-size: 13px; fill: #374151; }
    .managed { font-size: 13px; font-style: italic; fill: #1e40af; }
    .div { stroke: #d1d5db; stroke-width: 1; }
    .foot { font-size: 12px; fill: #4b5563; }
  </style>
  <rect width="1000" height="620" fill="#ffffff"/>

  <rect class="host" x="10" y="20" width="980" height="462" rx="10"/>
  <text class="area" x="25" y="44">Mac M4 Pro, 24 GiB (course host)</text>

  <rect class="k8s" x="25" y="58" width="730" height="412" rx="8"/>
  <text class="area" x="40" y="82">Minikube</text>
  <text class="areasub" x="120" y="82">managed: Amazon EKS</text>

  <!-- Row 1 -->
  <rect class="comp" x="40" y="98" width="220" height="112" rx="6"/>
  <text class="name" x="150" y="120" text-anchor="middle">Segmentation service</text>
  <text class="local" x="150" y="139" text-anchor="middle">FastAPI, web UI,</text>
  <text class="local" x="150" y="156" text-anchor="middle">CPU workers</text>
  <line class="div" x1="55" y1="167" x2="245" y2="167"/>
  <text class="managed" x="150" y="190" text-anchor="middle">Amazon EKS</text>

  <rect class="comp" x="280" y="98" width="220" height="112" rx="6"/>
  <text class="name" x="390" y="120" text-anchor="middle">GIS assistant</text>
  <text class="local" x="390" y="139" text-anchor="middle">assistant API</text>
  <line class="div" x1="295" y1="167" x2="485" y2="167"/>
  <text class="managed" x="390" y="190" text-anchor="middle">Amazon EKS</text>

  <rect class="comp" x="520" y="98" width="220" height="112" rx="6"/>
  <text class="name" x="630" y="120" text-anchor="middle">Identity</text>
  <text class="local" x="630" y="139" text-anchor="middle">per-user tokens</text>
  <text class="local" x="630" y="156" text-anchor="middle">with roles</text>
  <line class="div" x1="535" y1="167" x2="725" y2="167"/>
  <text class="managed" x="630" y="190" text-anchor="middle">Amazon Cognito</text>

  <!-- Row 2 -->
  <rect class="comp" x="40" y="222" width="220" height="112" rx="6"/>
  <text class="name" x="150" y="244" text-anchor="middle">Object storage</text>
  <text class="local" x="150" y="263" text-anchor="middle">Floci (S3 API),</text>
  <text class="local" x="150" y="280" text-anchor="middle">DVC remote</text>
  <line class="div" x1="55" y1="291" x2="245" y2="291"/>
  <text class="managed" x="150" y="314" text-anchor="middle">Amazon S3</text>

  <rect class="comp" x="280" y="222" width="220" height="112" rx="6"/>
  <text class="name" x="390" y="244" text-anchor="middle">PostgreSQL + pgvector</text>
  <text class="local" x="390" y="263" text-anchor="middle">PostgreSQL 16: jobs,</text>
