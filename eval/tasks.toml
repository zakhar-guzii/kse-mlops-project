# Lab 5 agent evaluation set (openspec change add-lab5-agent-eval, design Decisions 1 and 2; docs/design.md 5.4).
# Each task is checked from its trace alone: the stop reason, the tools of its attempts in order with arguments
# ignored (any order where the model chooses it), the tools it must not attempt, and the content checks below.
# Tasks with a reference answer are also judged by the Lab 3 judge (prompts/judge.md). The legend questions and
# their sources are copied from eval/questions.toml (field `from`), chosen as the export-contract questions before
# any agent answer was read. t11 and t12 make a tool fail by pointing it at a closed port; no fault code exists.

[[tasks]]
id = "t01"
type = "legend"
from = "q01"
task = "Which number marks bare soil pixels in the mask this service exports?"
stop = ["answered"]
tools = ["retrieve"]
forbid = ["predict"]
reference = "Bare soil (the class bareland) is ID 0 in the exported mask."

[[tasks.sources]]
doc_id = "export-contract"
locator = "5.1 Problem statement"
evidence = "| 0 | 1 | bareland |"

[[tasks]]
id = "t02"
type = "legend"
from = "q03"
task = "In the mask this service exports, are sidewalks and car parks given a class of their own, or are they merged with roads?"
stop = ["answered"]
tools = ["retrieve"]
forbid = ["predict"]
reference = "Neither: sidewalks and parking lots belong to developed space (ID 2), not to road."

[[tasks.sources]]
doc_id = "export-contract"
locator = "5.1 Problem statement"
evidence = "Examples of `developed space` are sidewalks and parking lots."

[[tasks]]
id = "t03"
type = "legend"
from = "q04"
task = "After I upload an image to this service, how long can I still download its finished outputs?"
stop = ["answered"]
tools = ["retrieve"]
forbid = ["predict"]
reference = "Until 24 hours after the upload was accepted, a window that includes queue and processing time."

[[tasks.sources]]
doc_id = "export-contract"
locator = "6.8 Integration points"
evidence = "available until `accepted_at` + 24 h, including queue and processing time"

[[tasks]]
id = "t04"
type = "unanswerable"
task = "What is the phone number of the service's support desk?"
stop = ["unable"]
stopped_by = "model"
tools = []
forbid = ["predict"]

[[tasks]]
id = "t05"
type = "predict"
task = "Segment tile D017-2021/AA-S2-10_1-1."
tile = "D017-2021/AA-S2-10_1-1"
stop = ["answered"]
tools = ["predict"]
names_prediction = true

[[tasks]]
id = "t06"
type = "combined"
from = "q02"
task = "Segment tile D017-2021/AA-S2-9_2-7 and explain what the value 255 means in the mask."
tile = "D017-2021/AA-S2-9_2-7"
stop = ["answered"]
tools = ["predict", "retrieve"]
order = "any"
names_prediction = true
reference = "255 is not a land-cover class but marks pixels ignored in training and invalid input pixels."

[[tasks.sources]]
doc_id = "export-contract"
locator = "5.1 Problem statement"
evidence = "ID 255 marks pixels ignored in training and invalid input pixels in the output"

[[tasks]]
id = "t07"
type = "combined"
task = "Segment tile D017-2021/AF-S2-11_1-4. Which class covers the largest share of it, and what does the legend say that class includes?"
tile = "D017-2021/AF-S2-11_1-4"
stop = ["answered"]
tools = ["predict", "retrieve"]
order = "any"
