[project]
name = "kse-mlops-project"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "joblib==1.6.0",
    "mlflow==3.16.1",
    "numpy==2.5.5",
    "prometheus-client==0.26.0",
    "psycopg[binary]==3.3.9",
    "rasterio==1.5.2",
    "scikit-image==0.26.0",
    "scikit-learn==1.9.1",
]

[dependency-groups]
demo = [
    "ipython==9.19.1",
    "jupyterlab==4.6.6",
    "matplotlib==3.11.2",
]
dev = [
    "dvc==3.67.1",
    "dvc-s3==3.3.0",
    "httpx2==2.16.2",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "ruff==0.17.2",
]
nn = [
    "huggingface-hub==2.4.0",
    "segmentation-models-pytorch==0.5.0",
    "timm==1.0.31",
    "torch==2.15.0",
]
rag = [
    "sentence-transformers==6.3.0",
]
# Lab 4 drift report job (image target monitor). Evidently 0.7.23 fails to import with pandas 3,
# so pandas is pinned below it; the project reaches pandas only through mlflow.
monitor = [
    "evidently==0.7.23",
    "pandas==2.3.3",
]
# Lab 4 service images (docker/serve/Dockerfile): both models on the CPU-only torch build.
serve = [
    "segmentation-models-pytorch==0.5.0",
    "sentence-transformers==6.3.0",
    "timm==1.0.31",
    "torch==2.15.0",
    "torchvision==0.29.2",
]

# nn and rag keep the PyPI torch, which is the CUDA build on Linux (Colab training).
[tool.uv]
conflicts = [
    [{ group = "serve" }, { group = "nn" }],
    [{ group = "serve" }, { group = "rag" }],
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", group = "serve" }]
torchvision = [{ index = "pytorch-cpu", group = "serve" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
filterwarnings = ["ignore::rasterio.errors.NotGeoreferencedWarning"]
