# Lab 4 Prometheus (openspec add-lab4-monitoring, design Decision 8): the two services and the Pushgateway by
# Service name. honor_labels keeps the job and labels the drift report pushed instead of the gateway's own.
# Alert rules and routing (openspec add-lab4-drift-alert, design Decisions 2 and 3): alerts.yml from the same
# ConfigMap, sent to Alertmanager.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers:
    - static_configs: [{targets: ["alertmanager:9093"]}]
scrape_configs:
  - job_name: ml
    static_configs: [{targets: ["ml:8000"]}]
  - job_name: llm
    static_configs: [{targets: ["llm:8000"]}]
  - job_name: pushgateway
    honor_labels: true
    static_configs: [{targets: ["pushgateway:9091"]}]
