# Lab 4 cluster (openspec add-lab4-cluster, design Decisions 2-8). Applied by scripts/cluster.sh, which replaces
# COMMIT with the full SHA of HEAD and creates the Secret `landcover` and the ConfigMap `postgres-init` from .env
# and sql/warehouse.sql. Memory requests and limits are the measured footprints with a margin (README, Lab 4: cluster).

apiVersion: v1
kind: ConfigMap
metadata:
  name: landcover
data:
  MLFLOW_TRACKING_URI: http://mlflow:5000
  MODEL_NAME: landcover-segmenter
  MODEL_ALIAS: champion
  LLM_BASE_URL: http://host.minikube.internal:8081/v1
---
# PostgreSQL with pgvector: databases landcover (serving, retrieval) and mlflow, created by sql/warehouse.sql.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres
  labels: {app: postgres}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 2Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels: {app: postgres}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:0.8.7-pg16-trixie
          env:
            - {name: POSTGRES_DB, value: landcover}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: landcover, key: POSTGRES_USER}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: landcover, key: POSTGRES_PASSWORD}}
          ports: [{containerPort: 5432}]
          # Over TCP: the server that runs the init scripts listens only on the socket.
          readinessProbe:
            exec: {command: [sh, -c, 'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d landcover']}
            periodSeconds: 5
          resources:
            requests: {memory: 128Mi, cpu: 100m}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: postgres}
        - name: init
          configMap: {name: postgres-init}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: {app: postgres}
spec:
  selector: {app: postgres}
  ports: [{port: 5432}]
---
# MLflow: metadata in PostgreSQL, model files proxied to the volume; one worker (Lab 4 Notes).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-artifacts
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 2Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: mlflow}}
  template:
    metadata: {labels: {app: mlflow}}
    spec:
      containers:
        - name: mlflow
          image: landcover-mlflow:3.16.1
          imagePullPolicy: IfNotPresent
          command: [mlflow, server]
          args:
            - --host=0.0.0.0
            - --port=5000
            - --workers=1
            - --backend-store-uri=postgresql://$(POSTGRES_USER)@postgres/mlflow
            - --artifacts-destination=/mlartifacts
            # The Service name for pods, the port-forward of scripts/cluster.sh for the host.
            - --allowed-hosts=mlflow:5000,mlflow.default.svc.cluster.local:5000,localhost:5002,127.0.0.1:5002
          env:
            # The password through PGPASSWORD, so it is not in the process arguments.
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: landcover, key: POSTGRES_USER}}
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: landcover, key: POSTGRES_PASSWORD}}
            # MLflow 3.16 otherwise starts about ten job-runner processes of ~220 MB each for GenAI jobs.
            - {name: MLFLOW_SERVER_ENABLE_JOB_EXECUTION, value: "false"}
          ports: [{containerPort: 5000}]
          startupProbe:
            httpGet: {path: /health, port: 5000}
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 5000}
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: {memory: 512Mi, cpu: 100m}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: artifacts, mountPath: /mlartifacts}
      volumes:
        - name: artifacts
          persistentVolumeClaim: {claimName: mlflow-artifacts}
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
spec:
  selector: {app: mlflow}
  ports: [{port: 5000}]
---
# ML service: the model by name and alias from the registry; ready only when it is loaded.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml
spec:
  replicas: 1
  selector: {matchLabels: {app: ml}}
  template:
    metadata: {labels: {app: ml}}
    spec:
      containers:
        - name: ml
          image: landcover-ml:COMMIT
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: landcover}
          env:
            - name: WAREHOUSE_DSN
              valueFrom: {secretKeyRef: {name: landcover, key: WAREHOUSE_DSN}}
          ports: [{containerPort: 8000}]
          # No startup probe: the server answers at once and loads the model in the background.
          readinessProbe:
            httpGet: {path: /health/ready, port: 8000}
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /health/live, port: 8000}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Measured peak 1,476 MiB: the random forest on a 1024x1024 image.
          resources:
            requests: {memory: 1Gi, cpu: 500m}
            limits: {memory: 2Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: ml
spec:
  selector: {app: ml}
  ports: [{port: 8000}]
---
# LLM service: the Lab 3 retriever and prompt in the image, the text model on the host.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm
spec:
  replicas: 1
  selector: {matchLabels: {app: llm}}
  template:
    metadata: {labels: {app: llm}}
    spec:
      containers:
        - name: llm
          image: landcover-llm:COMMIT
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: landcover}
          env:
            - name: WAREHOUSE_DSN
              valueFrom: {secretKeyRef: {name: landcover, key: WAREHOUSE_DSN}}
          ports: [{containerPort: 8000}]
          # The embedding model loads before the server accepts connections.
          startupProbe:
            httpGet: {path: /health/live, port: 8000}
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health/ready, port: 8000}
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /health/live, port: 8000}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: {memory: 1Gi, cpu: 250m}
            limits: {memory: 1536Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: llm
spec:
  selector: {app: llm}
  ports: [{port: 8000}]
---
# The retrieval index of the LLM image's corpus and settings; one Job per commit, so a repeated run does nothing.
apiVersion: batch/v1
kind: Job
metadata:
  name: retrieval-index-COMMIT
  labels: {app: retrieval-index}
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: index
          image: landcover-llm:COMMIT
          imagePullPolicy: IfNotPresent
          command: [python, -m, landcover.retrieval, index]
          env:
            # The image pins one thread for serving; one-off embedding of ~575 chunks took 124 s with it.
            - {name: OMP_NUM_THREADS, value: "4"}
            - name: WAREHOUSE_DSN
              valueFrom: {secretKeyRef: {name: landcover, key: WAREHOUSE_DSN}}
          resources:
            requests: {memory: 1Gi, cpu: 500m}
            limits: {memory: 1536Mi}
---
# Monitoring (openspec add-lab4-monitoring, design Decision 8). scripts/cluster.sh creates the ConfigMaps
# prometheus (k8s/prometheus.yml), grafana-provisioning and grafana-dashboards (k8s/grafana/).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pushgateway
  labels: {app: pushgateway}
spec:
  replicas: 1
  selector: {matchLabels: {app: pushgateway}}
  template:
    metadata: {labels: {app: pushgateway}}
    spec:
      containers:
        - name: pushgateway
          image: prom/pushgateway:v1.11.4
          ports: [{containerPort: 9091}]
          readinessProbe:
            httpGet: {path: /-/ready, port: 9091}
            periodSeconds: 10
          resources:
            requests: {memory: 32Mi, cpu: 50m}
            limits: {memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: pushgateway
  labels: {app: pushgateway}
spec:
  selector: {app: pushgateway}
  ports: [{port: 9091}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels: {app: prometheus}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus}}
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.13.5
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=2d
          ports: [{containerPort: 9090}]
          readinessProbe:
            httpGet: {path: /-/ready, port: 9090}
            periodSeconds: 10
          resources:
            requests: {memory: 128Mi, cpu: 100m}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus, readOnly: true}
            # ponytail: emptyDir, the series are lost with the pod; add a PVC if history must survive restarts.
            - {name: data, mountPath: /prometheus}
      volumes:
        - name: config
          configMap: {name: prometheus}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels: {app: prometheus}
spec:
  selector: {app: prometheus}
  ports: [{port: 9090}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels: {app: grafana}
spec:
  replicas: 1
  selector: {matchLabels: {app: grafana}}
  template:
    metadata: {labels: {app: grafana}}
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:13.3.2
          env:
            # Reached only through a port-forward on 127.0.0.1, like MLflow; viewers need no login.
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer}
            - {name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: /var/lib/grafana/dashboards/landcover.json}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false"}
          ports: [{containerPort: 3000}]
          readinessProbe:
            httpGet: {path: /api/health, port: 3000}
            periodSeconds: 10
          # Grafana 13 was OOM-killed at start with a 256 Mi limit and peaked at 511 Mi (README, Lab 4: monitoring).
          resources:
            requests: {memory: 512Mi, cpu: 100m}
            limits: {memory: 768Mi}
          volumeMounts:
            - {name: provisioning, mountPath: /etc/grafana/provisioning/datasources/datasource.yml,
               subPath: datasource.yml, readOnly: true}
            - {name: provisioning, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml,
               subPath: dashboards.yml, readOnly: true}
            - {name: dashboards, mountPath: /var/lib/grafana/dashboards, readOnly: true}
      volumes:
        - name: provisioning
          configMap: {name: grafana-provisioning}
        - name: dashboards
          configMap: {name: grafana-dashboards}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels: {app: grafana}
spec:
  selector: {app: grafana}
  ports: [{port: 3000}]
---
# The drift report: every 5 minutes, the window of the 5 minutes before (python -m landcover.monitor report).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: drift-report
  labels: {app: drift-report}
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  # A run more than 2 minutes late is skipped rather than reported against the wrong window.
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: report
              image: landcover-monitor:COMMIT
              imagePullPolicy: IfNotPresent
              envFrom: [{configMapRef: {name: landcover}}]
              env:
                - {name: PUSHGATEWAY_URL, value: "http://pushgateway:9091"}
                - {name: WINDOW_MINUTES, value: "5"}
                - {name: MIN_OBSERVATIONS, value: "50"}
                # Provisional: no-shift p95 0.45 (design 6.6); justified in add-lab4-drift-alert.
                - {name: DRIFT_THRESHOLD, value: "0.5"}
                - name: WAREHOUSE_DSN
                  valueFrom: {secretKeyRef: {name: landcover, key: WAREHOUSE_DSN}}
              # Measured peak 234 Mi on a window of 128 rows against 256 reference rows.
              resources:
                requests: {memory: 256Mi, cpu: 100m}
                limits: {memory: 512Mi}
